name: Deploy

# Läuft, wenn CI auf main grün ist, oder manuell.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Image-Namen müssen klein geschrieben sein.
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    # Nur echte Pushes auf main im eigenen Repo (keine Fork-PRs mit einem Branch namens "main").
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: web
            context: .
            file: deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: prefix
        run: echo "value=${IMAGE_PREFIX,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}/raumbelegung-${{ matrix.name }}:latest
            ${{ steps.prefix.outputs.value }}/raumbelegung-${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH einrichten
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Auf dem Server aktualisieren
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$TARGET" '
            set -e
            cd /opt/raumbelegung/deploy
            docker compose -f docker-compose.prod.yml pull web backend
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          '
      - name: Health-Check
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 20); do
            ssh "$TARGET" \
              'cd /opt/raumbelegung/deploy && docker compose -f docker-compose.prod.yml ps --format "{{.Service}} {{.Health}}"' | tee /tmp/ps
            grep -q "backend healthy" /tmp/ps && exit 0
            sleep 6
          done
          echo "Backend wurde nicht healthy" && exit 1
