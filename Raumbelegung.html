<style>
/* Layout: schmale Formularspalte links, rechts Wochenübersicht und Serienliste; unter 820px einspaltig. */
:root {
  --bg: #f1f4f7;
  --surface: #ffffff;
  --fg: #1b2530;
  --muted: #5a6776;
  --line: #d6dde5;
  --accent: #2a4d78;
  --on-accent: #ffffff;
  --ok: #1f6b4b;
  --ok-bg: #e4f2eb;
  --bad: #a93428;
  --bad-bg: #fbeae7;
  --info-bg: #e8eef5;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #19212a; --fg: #e5eaf0; --muted: #98a5b3; --line: #2b3541;
    --accent: #8db4e2; --on-accent: #10202f; --ok: #6cc9a0; --ok-bg: #173028;
    --bad: #ff9283; --bad-bg: #3a201d; --info-bg: #1f2a36; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #19212a; --fg: #e5eaf0; --muted: #98a5b3; --line: #2b3541;
  --accent: #8db4e2; --on-accent: #10202f; --ok: #6cc9a0; --ok-bg: #173028;
  --bad: #ff9283; --bad-bg: #3a201d; --info-bg: #1f2a36; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1060px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 24px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.store { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 19px; margin: 0 0 12px; text-wrap: balance; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
@media (min-width: 820px) { .grid { grid-template-columns: minmax(0, 360px) minmax(0, 1fr); align-items: start; } }
.col { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
form { display: flex; flex-direction: column; gap: 14px; }
label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
input, select, button { font: inherit; }
input, select {
  width: 100%; min-width: 0; padding: 9px 10px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; font-weight: 400;
}
input[type="time"], input[type="date"] { font-family: var(--f-mono); font-size: 14px; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.check { padding: 12px 14px; border-radius: 6px; font-size: 14px; background: var(--info-bg); color: var(--fg); }
.check strong { display: block; font-weight: 600; }
.check.ok { background: var(--ok-bg); color: var(--ok); }
.check.bad { background: var(--bad-bg); color: var(--bad); }
.check ul { margin: 6px 0 0; padding-left: 18px; }
.check li { margin: 2px 0; }
.btn {
  border: 0; border-radius: 6px; padding: 11px 14px; font-weight: 600; cursor: pointer;
  background: var(--accent); color: var(--on-accent);
}
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.warn { background: var(--bad); color: var(--surface); }
.msg { min-height: 20px; font-size: 13px; color: var(--ok); margin: -4px 0 0; }
.day { border-top: 1px solid var(--line); padding: 12px 0; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 16px; }
.day:last-child { border-bottom: 1px solid var(--line); }
@media (max-width: 520px) { .day { grid-template-columns: minmax(0, 1fr); } }
.dayhead { font-weight: 600; }
.dayhead small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.slots { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.slot { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.time { font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }
.slot .t { min-width: 0; overflow-wrap: anywhere; }
.clash .time, .clash .t { color: var(--bad); }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--info-bg); color: var(--muted); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.series { list-style: none; margin: 0; padding: 0; }
.series li { border-top: 1px solid var(--line); padding: 11px 0; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; }
.series li:last-child { border-bottom: 1px solid var(--line); }
.series .info { min-width: 0; flex: 1 1 220px; }
.series .name { font-weight: 600; overflow-wrap: anywhere; }
.series .when { color: var(--muted); font-size: 13px; }
.link { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 4px; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.link.confirm { color: var(--bad); font-weight: 600; }
.empty { color: var(--muted); padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.empty .btn { margin-top: 10px; background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.viewhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
.viewhead h2 { margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
details.month { border-top: 1px solid var(--line); }
details.month:last-child { border-bottom: 1px solid var(--line); }
details.month > summary { cursor: pointer; padding: 11px 0; display: flex; align-items: center; gap: 12px; font-weight: 600; list-style: none; }
details.month > summary::-webkit-details-marker { display: none; }
details.month > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details.month > summary .mn { flex: 1; min-width: 0; }
details.month > summary .cnt { font-weight: 400; color: var(--muted); font-size: 13px; }
details.month > summary::after { content: ""; flex: none; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: -3px 4px 0 0; }
details.month[open] > summary::after { transform: rotate(-135deg); margin: 3px 4px 0 0; }
details.month > .empty { border: 0; padding: 0 0 12px; }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Raumbelegung</h1>
      <p class="sub">Prüft jede neue Buchung gegen alle wiederkehrenden Termine.</p>
    </div>
    <div class="store" id="store">Speicher wird verbunden …</div>
  </header>

  <div class="grid">
    <div class="col">
      <section class="panel" aria-labelledby="h-new">
        <h2 id="h-new">Neue Buchung</h2>
        <form id="f" novalidate>
          <label for="title">Veranstaltung
            <input id="title" type="text" maxlength="80" placeholder="z. B. Kartenspielen" autocomplete="off">
          </label>
          <label for="date">Datum (bei Serien der erste Termin)
            <input id="date" type="date">
          </label>
          <div class="row2">
            <label for="start">Von <input id="start" type="time" value="10:00"></label>
            <label for="end">Bis <input id="end" type="time" value="12:00"></label>
          </div>
          <label for="rec">Wiederholung
            <select id="rec">
              <option value="none">Einmalig</option>
              <option value="daily">Täglich</option>
              <option value="weekdays">Montag bis Freitag</option>
              <option value="weekly">Wöchentlich</option>
              <option value="monthly">Monatlich</option>
              <option value="monthlyLast">Monatlich, letzter Wochentag</option>
            </select>
          </label>
          <label for="until" id="untilWrap" hidden>Serie endet am (optional)
            <input id="until" type="date">
          </label>
          <div id="check" class="check" role="status" aria-live="polite"></div>
          <button class="btn" id="save" type="submit" disabled>Buchung speichern</button>
          <p class="msg" id="msg" role="status"></p>
          <p class="hint">Serien werden für die nächsten 24 Monate ab dem ersten Termin geprüft.</p>
        </form>
      </section>
    </div>

    <div class="col">
      <section aria-labelledby="h-next">
        <div class="viewhead">
          <h2 id="h-next">Belegung</h2>
          <div class="seg" id="seg" role="group" aria-label="Zeitraum">
            <button type="button" data-v="4w" aria-pressed="true">4 Wochen</button>
            <button type="button" data-v="2026" aria-pressed="false">2026</button>
            <button type="button" data-v="2027" aria-pressed="false">2027</button>
          </div>
        </div>
        <div id="overview"></div>
      </section>
      <section aria-labelledby="h-all">
        <h2 id="h-all">Alle Buchungen</h2>
        <div id="all"></div>
      </section>
    </div>
  </div>
</div>

<script>
/*LOGIC*/
const WD = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WD_S = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const pad = n => String(n).padStart(2, '0');
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fmt = d => WD_S[d.getDay()] + ', ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const nth = d => Math.ceil(d.getDate() / 7);
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, 12);

function occursOn(b, d) {
  const s = iso(d);
  if (s < b.date) return false;
  if (b.until && s > b.until) return false;
  if (b.rec === 'none') return s === b.date;
  if (b.rec === 'daily') return true;
  if (b.rec === 'weekdays') return d.getDay() >= 1 && d.getDay() <= 5;
  const st = pd(b.date);
  if (d.getDay() !== st.getDay()) return false;
  if (b.rec === 'weekly') return true;
  if (b.rec === 'monthlyLast') return d.getDate() + 7 > new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return nth(d) === nth(st);
}
function overlaps(a, b) { return mins(a.start) < mins(b.end) && mins(b.start) < mins(a.end); }
function candidateDates(b, horizon) {
  const first = pd(b.date);
  if (b.rec === 'none') return [first];
  const out = [];
  for (let i = 0; i <= horizon; i++) {
    const d = addDays(first, i);
    if (b.until && iso(d) > b.until) break;
    if (occursOn(b, d)) out.push(d);
  }
  return out;
}
function findConflicts(b, others, horizon = 730) {
  const map = new Map();
  for (const d of candidateDates(b, horizon)) {
    for (const o of others) {
      if (o.id && o.id === b.id) continue;
      if (occursOn(o, d) && overlaps(b, o)) {
        if (!map.has(o.id)) map.set(o.id, { other: o, dates: [] });
        map.get(o.id).dates.push(d);
      }
    }
  }
  return [...map.values()];
}
function describe(b) {
  const d = pd(b.date);
  const until = b.until ? ' bis ' + pad(pd(b.until).getDate()) + '.' + pad(pd(b.until).getMonth() + 1) + '.' + pd(b.until).getFullYear() : '';
  if (b.rec === 'daily') return 'täglich' + until;
  if (b.rec === 'weekdays') return 'Montag bis Freitag' + until;
  if (b.rec === 'monthlyLast') return 'jeden letzten ' + WD[d.getDay()] + ' im Monat' + until;
  if (b.rec === 'weekly') return 'jeden ' + WD[d.getDay()] + until;
  if (b.rec === 'monthly') return 'jeden ' + nth(d) + '. ' + WD[d.getDay()] + ' im Monat' + until;
  return fmt(d);
}
/*END*/

const $ = id => document.getElementById(id);
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const clock = b => b.start + '–' + b.end;

let items = [];
let store = null;      // db collection, or null when only local
let ready = false;
let armedDelete = null;
let armTimer = null;

/* ---------- Speicher ---------- */
const LS = 'raumbelegung-buchungen';
function lsRead() { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch (e) { return []; } }
function lsWrite() { try { localStorage.setItem(LS, JSON.stringify(items)); } catch (e) {} }

async function addBooking(data) {
  if (store) { await store.add(data); return; }
  items = items.concat([{ id: 'l' + Date.now() + Math.random().toString(36).slice(2, 6), ...data }]);
  lsWrite(); renderAll();
}
async function removeBooking(id) {
  if (store) { await store.doc(id).delete(); return; }
  items = items.filter(b => b.id !== id); lsWrite(); renderAll();
}

/* ---------- Darstellung ---------- */
let view = '4w';
let openMonths = null;
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const occurrences = day => items.filter(b => occursOn(b, day)).sort((a, b) => mins(a.start) - mins(b.start));

function dayBlock(day, occ, i) {
  const clash = new Set();
  occ.forEach((a, x) => occ.forEach((b, y) => { if (x < y && overlaps(a, b)) { clash.add(a.id); clash.add(b.id); } }));
  const slots = h('div', { class: 'slots' });
  occ.forEach(b => {
    const s = h('div', { class: 'slot' + (clash.has(b.id) ? ' clash' : '') },
      h('span', { class: 'time' }, clock(b)), h('span', { class: 't' }, b.title));
    if (clash.has(b.id)) s.append(h('span', { class: 'tag bad' }, 'Überschneidung'));
    slots.append(s);
  });
  const head = h('div', { class: 'dayhead' }, WD_S[day.getDay()] + ', ' + pad(day.getDate()) + '.' + pad(day.getMonth() + 1) + '.');
  if (i === 0) head.append(h('small', {}, 'heute'));
  if (i === 1) head.append(h('small', {}, 'morgen'));
  return h('div', { class: 'day' }, head, slots);
}

function renderYear(box, year, today) {
  if (!openMonths) openMonths = new Set([today.getFullYear() + '-' + (today.getMonth() + 1), '2027-1']);
  for (let m = 0; m < 12; m++) {
    const key = year + '-' + (m + 1);
    const days = new Date(year, m + 1, 0).getDate();
    const blocks = []; let n = 0;
    for (let dd = 1; dd <= days; dd++) {
      const day = new Date(year, m, dd, 12);
      const occ = occurrences(day);
      if (!occ.length) continue;
      n += occ.length;
      blocks.push(dayBlock(day, occ, Math.round((day - today) / 86400000)));
    }
    const det = h('details', { class: 'month' });
    if (openMonths.has(key)) det.open = true;
    det.append(h('summary', {}, h('span', { class: 'mn' }, MONTHS[m] + ' ' + year),
      h('span', { class: 'cnt' }, n ? n + ' Termine an ' + blocks.length + ' Tagen' : 'keine Termine')));
    if (blocks.length) blocks.forEach(b => det.append(b)); else det.append(h('div', { class: 'empty' }, 'Der Raum ist frei.'));
    det.addEventListener('toggle', () => { if (det.open) openMonths.add(key); else openMonths.delete(key); });
    box.append(det);
  }
}

function renderOverview() {
  const box = $('overview'); box.replaceChildren();
  document.querySelectorAll('#seg button').forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.v === view)));
  const today = new Date(); today.setHours(12, 0, 0, 0);
  if (view !== '4w') { renderYear(box, Number(view), today); return; }
  let any = false;
  for (let i = 0; i < 28; i++) {
    const day = addDays(today, i);
    const occ = occurrences(day);
    if (!occ.length) continue;
    any = true;
    box.append(dayBlock(day, occ, i));
  }
  if (!any) box.append(h('div', { class: 'empty' }, items.length ? 'In den nächsten vier Wochen ist der Raum frei.' : 'Noch keine Buchungen. Der Raum ist frei.'));
}

function renderAll() {
  renderOverview();
  const box = $('all'); box.replaceChildren();
  const todayIso = iso(new Date());
  const list = items.filter(b => b.rec !== 'none' || b.date >= todayIso).sort((a, b) => {
    const ra = a.rec === 'none' ? 1 : 0, rb = b.rec === 'none' ? 1 : 0;
    if (ra !== rb) return ra - rb;
    if (!ra) {
      const wk = x => (x.rec === 'daily' || x.rec === 'weekdays') ? -1 : (pd(x.date).getDay() + 6) % 7;
      const wa = wk(a), wb = wk(b);
      return wa - wb || mins(a.start) - mins(b.start);
    }
    return a.date.localeCompare(b.date) || mins(a.start) - mins(b.start);
  });
  if (!list.length) {
    const e = h('div', { class: 'empty' }, 'Hier erscheinen alle Serien und anstehenden Einzeltermine. Trage links die erste Buchung ein.');
    if (ready) e.append(h('br'), h('button', { class: 'btn', type: 'button', onclick: seedExamples }, 'Zwei Beispieltermine einfügen'));
    box.append(e);
    return;
  }
  const ul = h('ul', { class: 'series' });
  list.forEach(b => {
    const armed = armedDelete === b.id;
    const name = h('div', { class: 'name' }, b.title);
    if (b.example) name.append(' ', h('span', { class: 'tag' }, 'Beispiel'));
    const del = h('button', { class: 'link' + (armed ? ' confirm' : ''), type: 'button', onclick: () => onDelete(b.id) }, armed ? 'Wirklich löschen' : 'Löschen');
    ul.append(h('li', {},
      h('div', { class: 'info' }, name, h('div', { class: 'when' }, describe(b) + ', ', h('span', { class: 'time' }, clock(b)))),
      del));
  });
  box.append(ul);
}

function onDelete(id) {
  if (armedDelete === id) { armedDelete = null; clearTimeout(armTimer); removeBooking(id).catch(() => {}); return; }
  armedDelete = id; clearTimeout(armTimer);
  armTimer = setTimeout(() => { armedDelete = null; renderAll(); }, 4000);
  renderAll();
}

/* ---------- Formular und Live-Prüfung ---------- */
function readForm() {
  return {
    title: $('title').value.trim(), date: $('date').value, start: $('start').value, end: $('end').value,
    rec: $('rec').value, until: $('until').value || null
  };
}
let hasConflict = false;
function refreshForm() {
  const f = readForm();
  const d = f.date ? pd(f.date) : null;
  $('rec').options[3].text = d ? 'Wöchentlich (jeden ' + WD[d.getDay()] + ')' : 'Wöchentlich';
  $('rec').options[4].text = d ? 'Monatlich (jeden ' + nth(d) + '. ' + WD[d.getDay()] + ')' : 'Monatlich';
  $('rec').options[5].text = d ? 'Monatlich (jeden letzten ' + WD[d.getDay()] + ')' : 'Monatlich, letzter Wochentag';
  $('untilWrap').hidden = f.rec === 'none';
  const box = $('check'); box.className = 'check'; box.replaceChildren();
  const btn = $('save'); btn.className = 'btn'; btn.textContent = 'Buchung speichern';
  hasConflict = false;
  let valid = false;
  if (!f.title || !f.date || !f.start || !f.end) {
    box.append(h('strong', {}, 'Raumprüfung'), 'Veranstaltung, Datum und Uhrzeit eintragen, dann prüfe ich den Raum.');
  } else if (mins(f.end) <= mins(f.start)) {
    box.className = 'check bad'; box.append(h('strong', {}, 'Uhrzeit prüfen'), 'Das Ende muss nach dem Beginn liegen.');
  } else if (f.rec !== 'none' && f.until && f.until < f.date) {
    box.className = 'check bad'; box.append(h('strong', {}, 'Enddatum prüfen'), 'Die Serie darf nicht vor dem ersten Termin enden.');
  } else {
    valid = true;
    const found = findConflicts(f, items);
    if (!found.length) {
      box.className = 'check ok'; box.append(h('strong', {}, 'Raum frei'), 'Keine Überschneidung mit bestehenden Terminen.');
    } else {
      hasConflict = true;
      box.className = 'check bad';
      box.append(h('strong', {}, 'Raum bereits vergeben'));
      const ul = h('ul');
      found.forEach(c => {
        const n = c.dates.length;
        ul.append(h('li', {}, c.other.title + ' (' + describe(c.other) + ', ' + clock(c.other) + '): ' +
          (n === 1 ? 'am ' + fmt(c.dates[0]) : n + ' Termine, erstmals am ' + fmt(c.dates[0]))));
      });
      box.append(ul);
      btn.className = 'btn warn'; btn.textContent = 'Trotzdem speichern';
    }
  }
  btn.disabled = !(valid && ready);
}
['title', 'date', 'start', 'end', 'rec', 'until'].forEach(id => { $(id).addEventListener('input', refreshForm); $(id).addEventListener('change', refreshForm); });

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  if ($('save').disabled) return;
  const f = readForm();
  const data = { title: f.title, date: f.date, start: f.start, end: f.end, rec: f.rec };
  if (f.rec !== 'none' && f.until) data.until = f.until;
  $('save').disabled = true;
  try {
    await addBooking(data);
    $('title').value = '';
    $('msg').textContent = hasConflict ? 'Gespeichert, trotz Überschneidung.' : 'Buchung gespeichert.';
    setTimeout(() => { $('msg').textContent = ''; }, 3500);
  } catch (err) {
    $('msg').textContent = ''; $('check').className = 'check bad';
    $('check').replaceChildren(h('strong', {}, 'Speichern fehlgeschlagen'), 'Bitte versuche es in einem Moment noch einmal.');
    return;
  }
  refreshForm();
});

async function seedExamples() {
  const today = new Date(); today.setHours(12, 0, 0, 0);
  let tue = addDays(today, 1); while (tue.getDay() !== 2) tue = addDays(tue, 1);
  let wed = addDays(today, 1); while (!(wed.getDay() === 3 && wed.getDate() <= 7)) wed = addDays(wed, 1);
  try {
    await addBooking({ title: 'Spielenachmittag', date: iso(tue), start: '14:00', end: '17:00', rec: 'weekly', example: true });
    await addBooking({ title: 'Beratungssprechstunde', date: iso(wed), start: '10:00', end: '12:00', rec: 'monthly', example: true });
  } catch (e) {}
}
